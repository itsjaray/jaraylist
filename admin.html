<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Song Code Generator</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 30px; 
            background: #121212; 
            color: #fff; 
            max-width: 800px; 
            margin: 0 auto;
        }
        .box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: 20px;
        }
        input[type="file"] {
            margin-bottom: 15px;
        }
        textarea { 
            width: 100%; 
            height: 200px; 
            background: #121212; 
            color: #4ade80; 
            border: 1px solid #444; 
            padding: 12px; 
            border-radius: 6px; 
            font-family: monospace;
            font-size: 0.9rem;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>

    <h2>🛠️ ตัวช่วยสร้างโค้ดเพลงจากรูปภาพ</h2>
    <p>เลือกไฟล์รูปภาพเนื้อเพลงทั้งหมดที่คุณต้องการ (เลือกทีละหลายๆ รูปพร้อมกันได้เลย)</p>

    <div class="box">
        <input type="file" id="imageInput" multiple accept="image/*" onchange="generateCode()">
        
        <h3>📋 โค้ดสำหรับก๊อปปี้ไปใส่ใน index.html:</h3>
        <textarea id="output" readonly placeholder="โค้ดจะปรากฏที่นี่หลังจากเลือกรูปภาพ..."></textarea>
        <br>
        <button onclick="copyCode()">📋 คัดลอกโค้ด</button>
    </div>

    <script>
        function generateCode() {
            const files = document.getElementById('imageInput').files;
            let result = '';
            
            for (let i = 0; i < files.length; i++) {
                const fileName = files[i].name;
                // ตัดนามสกุลไฟล์ออก (เช่น .png หรือ .jpg) เพื่อเอามาทำเป็นชื่อเพลงเบื้องต้น
                const songTitle = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
                
                result += `{\n  id: ${Date.now() + i},\n  title: "${songTitle}",\n  image: "images/${fileName}"\n},\n`;
            }
            
            document.getElementById('output').value = result;
        }

        function copyCode() {
            const textarea = document.getElementById('output');
            textarea.select();
            document.execCommand('copy');
            alert('คัดลอกโค้ดเรียบร้อยแล้ว!');
        }
    </script>

</body>
</html>
