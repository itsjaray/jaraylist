<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARAY Setlist Categories</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #6366f1;
            --border-color: #334155;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .back-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-btn:hover { background: var(--primary-color); }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .category-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .category-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
        }
        .song-item {
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-item:last-child { border-bottom: none; }
        .song-name { color: var(--text-color); }
        .song-key {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #6366f1;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-color: #818cf8;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>🎵 หมวดหมู่เซ็ตลิสต์เพลง</h2>
        <a href="index.html" class="back-btn">⬅️ กลับหน้าหลัก</a>
    </div>

    <div class="container" id="categoryContainer">
        <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่อัตโนมัติ -->
    </div>

    <script>
        // ใช้ลิสต์เพลงชุดเดียวกับหน้าหลักของคุณ (หรือดึงมาจากอาเรย์เพลงที่คุณมี)
        const imageFiles = [
            // นำรายชื่อไฟล์เพลงของคุณมาใส่ไว้ที่นี่ หรือใช้ชุดเดียวกับ index.html
        ];

        function parseSongs() {
            return imageFiles.map((filename, index) => {
                let nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
                let title = nameWithoutExt;
                let key = "-";
                let category = "🚶 เพลงจังหวะกลาง"; // ค่าเริ่มต้น
                
                // 1. ดึงหมวดหมู่จากวงเล็บหน้าสุด เช่น [ช้า], [กลาง], [เร็ว], [สากล]
                const categoryMatch = nameWithoutExt.match(/^\[(.*?)\]/);
                if (categoryMatch) {
                    let catText = categoryMatch[1].trim();
                    if (catText.includes("ช้า")) category = "🐢 เพลงช้า";
                    else if (catText.includes("กลาง")) category = "🚶 เพลงจังหวะกลาง";
                    else if (catText.includes("เร็ว")) category = "🔥 เพลงเร็ว";
                    else if (catText.includes("สากล")) category = "🌍 สากล";
                    
                    // ตัดวงวดหมู่ออกเพื่อให้เหลือแค่ชื่อเพลงจริง ๆ
                    title = nameWithoutExt.replace(categoryMatch[0], '').trim();
                }

                // 2. ดึง Key ออกมา (ถ้ามีในวงเล็บท้ายชื่อ)
                const keyMatch = title.match(/\((Key\s*[^)]+)\)/i);
                if (keyMatch) {
                    key = keyMatch[1].trim();
                    title = title.replace(keyMatch[0], '').trim();
                }

                return { id: index + 1, title: title, key: key, category: category };
            });
        }

        function renderCategories() {
            const songs = parseSongs();
            const categories = {
                "🐢 เพลงช้า": [],
                "🚶 เพลงจังหวะกลาง": [],
                "🔥 เพลงเร็ว": [],
                "🌍 สากล": []
            };

            songs.forEach(song => {
                if (categories[song.category]) {
                    categories[song.category].push(song);
                } else {
                    categories["🚶 เพลงจังหวะกลาง"].push(song);
                }
            });

            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';

            for (let [catName, catSongs] of Object.entries(categories)) {
                let boxHTML = `
                    <div class="category-box">
                        <div class="category-title">
                            <span>${catName}</span>
                            <span style="font-size: 0.9rem; color: var(--text-muted);">(${catSongs.length} เพลง)</span>
                        </div>
                        <div>
                `;

                if (catSongs.length === 0) {
                    boxHTML += `<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">ไม่มีเพลงในหมวดนี้</div>`;
                } else {
                    catSongs.forEach(song => {
                        boxHTML += `
                            <div class="song-item">
                                <span class="song-name">${song.title}</span>
                                <span class="song-key">${song.key}</span>
                            </div>
                        `;
                    });
                }

                boxHTML += `</div></div>`;
                container.innerHTML += boxHTML;
            }
        }

        // ฟังก์ชันกดสลับโหมด
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeToggleButton');
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                btn.textContent = '🌙 โหมดมืด';
            } else {
                localStorage.setItem('theme', 'dark');
                btn.textContent = '☀️ โหมดสว่าง';
            }
        }

        // ตรวจสอบและซิงค์ธีมจากหน้าหลักอัตโนมัติ
        function applySavedTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            renderCategories();
        });
        
    </script>
</body>
</html>
